<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshops · Impact Hub Member Portal</title><link rel="stylesheet" href="styles.css?v=21"></head>
<body class="app"><script src="data.js?v=21"></script><script src="portal.js?v=21"></script><main class="wrap">
<div class="pagehead uni"><div><h1>Workshops &amp; Sessions</h1><p>Webinars and hands-on workshops led by 100th Street Bank associate volunteers. Free for members.</p></div><button class="btn" onclick="book()">Book 1:1 office hours</button></div>
<div class="fbar uni"><select id="ft"></select><select id="ff"></select></div>
<div id="out"></div>
<script>
const kw=searchBox(document.querySelector(".fbar"),"Search sessions and programs");kw.oninput=ren;opts(ft,"Topic",TOPICS);opts(ff,"Format",["Webinar","Workshop"]);
[ft,ff].forEach(s=>s.onchange=ren);
function btn(s){const r=regd().includes(s.id);if(r)return `<button class="btn sm done" onclick="toggleReg('${s.id}');ren()">${s.f=="Workshop"?"Scheduled ✓":"Registered ✓"}</button>`;return `<button class="btn sm" onclick="sessionModal('${s.id}',true);">${s.f=="Workshop"?"Schedule a time":"Register"}</button>`}
function ren(){const L=SESSIONS.filter(s=>hit(kw.value,s.t,s.n,s.m,s.f)&&(!ft.value||s.t==ft.value)&&(!ff.value||s.f==ff.value));
out.innerHTML=L.length?`<div class="grid wgrid">${L.map(s=>`<div class="card wcard${regd().includes(s.id)?" regd":""}"><div class="tagrow"><span class="tag">${s.t}</span><span class="tag">${s.f}</span></div><h3 style="margin-top:6px"><a href="#" onclick="event.preventDefault();sessionModal('${s.id}')">${s.n}</a></h3><p class="mut" style="margin:0 0 4px">Led by ${s.v}</p><p>${s.apply?"Next cohort starts ":""}${new Date(s.d+"T12:00").toDateString()} · ${fmtT(s.tm)}${s.m?" · "+s.m:""}</p><div class="foot">${btn(s)}</div></div>`).join("")}</div>`:"<p>No sessions match. Try fewer filters.</p>"}
ren();
const OH=[];[3,4,5,6,9,10,11,12,13,16,17,18,19,20].forEach(d=>["10:00","13:00","15:30"].forEach((t,i)=>{if((d+i)%3)OH.push(`2026-11-${String(d).padStart(2,"0")} ${t} ET`)}));
function book(){let pk=null;const m=modal(`<div style="border-top:5px solid var(--rec);margin:-22px -22px 16px;border-radius:10px 10px 0 0;height:5px"></div><div class="mgrid"><div class="mcol"><span class="tag">Workshops</span><span class="tag">1:1 office hours</span><h3 style="margin-top:8px">Book 1:1 office hours</h3><p class="mut"><b>With</b> a 100th Street Bank volunteer</p><p>A 30-minute one-on-one session on the topic of your choice.</p><form class="f" id="bf"><label>Topic<select>${AZ(TOPICS).map(t=>`<option>${t}</option>`).join("")}</select></label></form><p class="mut">Office hours · pick a day and time that works for you</p></div><div class="mcol"><div id="ohcal"></div>${notesBox()}<div style="margin-top:14px"><button class="btn" id="bfb" form="bf" disabled>Pick a day and time</button></div><div class="ok" id="bok"><b>Requested.</b> We'll confirm by email. (Prototype: nothing was sent.)</div></div></div>`);
slotCal(document.getElementById("ohcal"),OH,v=>{pk=v;bfb.disabled=!v;bfb.textContent=v?"Request "+new Date(v.slice(0,10)+"T12:00").toDateString().slice(0,10)+" · "+v.slice(11):"Pick a day and time"});wireNotes(m);
bf.onsubmit=e=>{e.preventDefault();m.querySelector(".mgrid").querySelectorAll(".mcol")[1].querySelectorAll(":scope>*:not(#bok)").forEach(x=>x.style.display="none");bok.style.display="block"}}
</script>
</main><script src="chrome.js?v=21"></script></body></html>
