<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accelerators · Impact Hub Member Portal</title><link rel="stylesheet" href="styles.css"></head>
<body class="app"><script src="data.js"></script><script src="portal.js"></script><main class="wrap">
<div class="pagehead"><div><h1>Accelerators &amp; incubators</h1><p>Programs in the 100th Street Bank network. Connect through the Hub and we share your member profile with the partner.</p></div></div>
<div class="fbar"><select id="fm"></select><select id="fs"></select></div><div class="grid" id="out"></div>
<script>const kw=searchBox(document.querySelector(".fbar"),"Search programs: name, focus, location");kw.oninput=ren;opts(fm,"Region",MARKETS);opts(fs,"Stage",["Idea / early stage","Early stage","Growth","Scaling"]);[fm,fs].forEach(s=>s.onchange=ren);
function ren(){const ap=LS.get("applied",[]);out.innerHTML=ACCS.filter(a=>hit(kw.value,a.n,a.org,a.m,a.st,a.len)&&(!fm.value||a.m==fm.value)&&(!fs.value||a.st==fs.value)).map(a=>`<div class="card"><div class="alogo">${a.l?`<img src="${a.l}" alt="${a.n} logo">`:`<span class="wm">${a.w}</span>`}</div><span class="tag">${a.m}</span><span class="tag">${a.st}</span><h3 style="margin-top:6px">${a.n}${a.S?S():""}</h3><p>${a.org}</p><p>${a.len}</p><div class="foot"><button class="btn sm ${ap.includes(a.n)?"done":""}" onclick="intro('${a.n}')">${ap.includes(a.n)?"Intro requested ✓":"Request intro"}</button>${srcLink(a.src)}</div></div>`).join("")}
function intro(n){const m=modal(`<h3>Request an intro: ${n}</h3><p class="mut">We'll pre-fill from your member profile.</p><form class="f" id="af"><label>Business<input value="${ME.biz}"></label><label>What do you want from the program?<textarea rows="3" required></textarea></label><button class="btn">Send intro request</button></form>`);
af.onsubmit=e=>{e.preventDefault();LS.set("applied",[...LS.get("applied",[]),n]);m.style.display="none";ren()}}ren()</script>
</main><script src="chrome.js"></script></body></html>
