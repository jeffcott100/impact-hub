<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accelerators · Impact Hub Member Portal</title><link rel="stylesheet" href="styles.css?v=5"></head>
<body class="app"><script src="data.js?v=5"></script><script src="portal.js?v=5"></script><main class="wrap">
<div class="pagehead"><div><h1>Accelerators &amp; incubators</h1></div></div>
<div class="fbar"><select id="fm"></select></div><div class="grid" id="out"></div>
<script>const kw=searchBox(document.querySelector(".fbar"),"Search programs: name, focus, location");kw.oninput=ren;opts(fm,"Region",MARKETS);fm.onchange=ren;
function ren(){const ap=LS.get("applied",[]);out.innerHTML=ACCS.filter(a=>hit(kw.value,a.n,a.org,a.m,a.len)&&(!fm.value||a.m==fm.value)).map(a=>`<div class="card"><div class="alogo">${a.l?`<img src="${a.l}" alt="${a.n} logo">`:`<span class="wm">${a.w}</span>`}</div><span class="tag">${a.m}</span><h3 style="margin-top:6px">${a.n}${a.S?S():""}</h3><p>${a.org}</p><p>${a.len}</p><div class="foot"><a class="btn sm" href="${a.u||"#"}" target="_blank" rel="noopener">Learn more</a></div></div>`).join("")}
function intro(n){const m=modal(`<h3>Request an intro: ${n}</h3><p class="mut">We'll pre-fill from your member profile.</p><form class="f" id="af"><label>Business<input value="${ME.biz}"></label><label>What do you want from the program?<textarea rows="3" required></textarea></label><button class="btn">Send intro request</button></form>`);
af.onsubmit=e=>{e.preventDefault();LS.set("applied",[...LS.get("applied",[]),n]);m.style.display="none";ren()}}ren()</script>
</main><script src="chrome.js?v=5"></script></body></html>
