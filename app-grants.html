<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funding · Impact Hub Member Portal</title><link rel="stylesheet" href="styles.css"></head>
<body class="app"><script src="data.js"></script><script src="portal.js"></script><main class="wrap">
<div class="pagehead"><div><h1>Funding</h1><p>Grants and competitions open to Hub members.</p></div></div>
<div class="fbar"><select id="fm"></select><select id="fy"></select></div><div class="grid" id="out"></div>
<script>const kw=searchBox(document.querySelector(".fbar"),"Search funding programs: keyword, eligibility, amount");kw.oninput=ren;opts(fm,"Region",MARKETS);opts(fy,"Type",["Grant","Competition","Loan"]);[fm,fy].forEach(s=>s.onchange=ren);
function ren(){const saved=LS.get("saved",[]);out.innerHTML=GRANTS.map((g,i)=>[g,i]).filter(([g])=>hit(kw.value,g.n,g.who,g.a,g.type,g.m,g.note||"")&&(!fm.value||g.m==fm.value)&&(!fy.value||g.type==fy.value)).map(([g,i])=>`<div class="card"><div class="alogo">${g.l?`<img src="${g.l}" alt="">`:`<span class="wm">${g.w}</span>`}</div><span class="tag">${g.type}</span><span class="tag">${g.m}</span><h3 style="margin-top:6px">${g.n}${g.S?S():""}</h3><p><b style="color:var(--navy)">${g.a}</b></p><p>${g.who}${g.note?". "+g.note:""}</p><div class="foot"><button class="btn sm ${saved.includes(i)?"done":""}" onclick="sv(${i})">${saved.includes(i)?"Saved ✓":"Save"}</button><button class="btn sm ghost" onclick="advisor('${g.n.replace(/'/g,"")}')">Talk to an advisor</button></div></div>`).join("")}
function sv(i){let s=LS.get("saved",[]);s=s.includes(i)?s.filter(x=>x!=i):[...s,i];LS.set("saved",s);ren()}ren()</script>
<p class="src">Amounts and eligibility for real programs reflect the cited public article and may have changed; check with the program before applying.</p>
</main><script src="chrome.js"></script></body></html>
